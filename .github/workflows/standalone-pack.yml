name: standalone-pack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: npm test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Full history, so the git-log check scans every commit, not just the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No secrets and no local lists here: the run prints the "local tiers: absent" line
      # and still enforces the shape, hash, slash-command, link, require, selfcheck,
      # files-list and git-log checks.
      - run: npm test
